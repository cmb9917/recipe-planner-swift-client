                      required:
                        - id
                        - title
                        - category
                        - tags
                        - featured
                        - content
                        - createdBy
                        - shareUrl
                        - createdAt
                        - updatedAt
                      additionalProperties: false
                  nextCursor:
                    type:
                      - string
                      - 'null'
                required:
                  - recipes
                  - nextCursor
                additionalProperties: false
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                type: object
                properties:
