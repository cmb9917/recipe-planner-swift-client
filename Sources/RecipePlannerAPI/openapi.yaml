openapi: 3.1.0
info:
  title: Recipe API
  version: 1.0.0
paths:
  /api/v1/auth/session:
    post:
      summary: Exchange a native ID token for an API access/refresh token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  const: google
                idToken:
                  type: string
                  minLength: 1
                deviceName:
                  type: string
                  maxLength: 200
              required:
                - provider
                - idToken
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type:
                          - string
                          - 'null'
                      displayName:
                        type:
                          - string
                          - 'null'
                    required:
                      - id
                      - email
                      - name
                      - displayName
                    additionalProperties: false
                required:
                  - accessToken
                  - refreshToken
                  - user
                additionalProperties: false
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        const: UNAUTHORIZED
                      message:
                        type: string
        '422':
          description: VALIDATION
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        const: VALIDATION
                      message:
                        type: string
        '500':
          description: INTERNAL
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        const: INTERNAL
                      message:
                        type: string
        '502':
          description: UPSTREAM
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        const: UPSTREAM
                      message:
                        type: string
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh token for a new access/refresh token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 1
              required:
                - refreshToken
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                required:
                  - accessToken
                  - refreshToken
                additionalProperties: false
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        const: UNAUTHORIZED
                      message:
                        type: string
        '422':
          description: VALIDATION
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        const: VALIDATION
                      message:
                        type: string
        '500':
          description: INTERNAL
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        const: INTERNAL
                      message:
                        type: string
  /api/v1/auth/logout:
    post:
      summary: Revoke a refresh token and its rotation chain
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 1
              required:
                - refreshToken
              additionalProperties: false
      responses:
        '204':
          description: No content
        '422':
          description: VALIDATION
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        const: VALIDATION
                      message:
                        type: string
        '500':
          description: INTERNAL
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        const: INTERNAL
                      message:
                        type: string
  /api/v1/recipes:
    get:
      summary: List the caller's family's recipes
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum:
              - BREAKFAST
              - DINNER
              - DESSERT
              - COCKTAILS
